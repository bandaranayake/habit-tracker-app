# Not a monorepo - this file only carries pnpm settings (their home as of
# pnpm 10+).

# Dependency build scripts are blocked by default. esbuild (used by Vite)
# fetches its platform binary on install. `allowBuilds` is what pnpm 11
# actually reads; `onlyBuiltDependencies` is kept for older pnpm.
allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild
