[package]
name = "habit-tracker"
version = "1.0.0"
edition = "2021"

[lib]
name = "habit_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.40.2"
thiserror = "2.0.21"
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
sha2 = "0.11.0"
base64 = "0.23.1"
getrandom = { version = "0.4.3", features = ["std"] }
tokio = { version = "1.53.2", features = ["time"] }
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3.27.0"

# rusqlite's libsqlite3-sys is replaced by ./sqlite3mc-sys, which compiles SQLite3 Multiple
# Ciphers, the engine the Electron app used. No system SQLite, no OpenSSL. Bump the patch
# crate's version and copied bindings together with rusqlite (see CLAUDE.md "SQLite engine").
[patch.crates-io]
libsqlite3-sys = { path = "sqlite3mc-sys" }
